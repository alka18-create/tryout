# ==============================================================================
# Konfigurasi Nginx Reverse Proxy untuk TryoutKu di Ubuntu VPS
# Salin file ini ke: /etc/nginx/sites-available/tryoutku
# Lalu aktifkan: ln -s /etc/nginx/sites-available/tryoutku /etc/nginx/sites-enabled/
# ==============================================================================

# 1. Redirect HTTP ke HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name cbt.domainanda.com; # GANTI DENGAN DOMAIN ANDA

    # Lokasi verifikasi Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Server Blok HTTPS Utama
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cbt.domainanda.com; # GANTI DENGAN DOMAIN ANDA

    # Sertifikat SSL (Akan diisi otomatis oleh Certbot)
    # ssl_certificate /etc/letsencrypt/live/cbt.domainanda.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/cbt.domainanda.com/privkey.pem;

    # Parameter SSL Modern & Aman
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384";
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Batas ukuran upload (Diatur 5MB untuk mengakomodasi gambar soal & jawaban 1MB)
    client_max_body_size 5M;

    # Gzip Compression untuk menghemat bandwidth VPS
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Caching Static Assets Next.js
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Proxy Utama ke Container Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Header WebSocket & Keepalive
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;

        # Forwarding Client IP Asli
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout pengerjaan ujian & autosave
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
