services:
  postgres:
    image: postgres:17-alpine
    container_name: tryoutku-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tryoutku}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tryoutku_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-tryoutku}
    # Port 5432/5433 sudah dipakai project lain di mesin ini → pakai 5434
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - tryoutku_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tryoutku} -d ${POSTGRES_DB:-tryoutku}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tryoutku_pgdata:
